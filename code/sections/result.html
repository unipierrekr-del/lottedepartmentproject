<!-- ═══════════════════════════════════════════════════════════
   result.html — 추천 결과 & 패키지 비교 섹션
   ---------------------------------------------------------------
   - 추천 결과 카드 (JS로 동적 생성)
   - 가상 패키징 프리뷰 (색상/리본 선택)
   - 품의서 & 견적서 생성 버튼
   - 3가지 패키지 비교 테이블
═══════════════════════════════════════════════════════════════ -->
<!-- RESULT -->
<section id="result-section">
  <div class="res-wrap" style="max-width:1200px;margin:0 auto">

    <!-- 상단 바 -->
    <div class="res-top-bar">
      <div class="res-top-bar-left">
        <button class="res-back-btn" onclick="wizRestart()">&#8592; 견적 수정</button>
        <div class="res-client-tag" id="res-client-tag">기업 맞춤 큐레이션</div>
      </div>
      <button class="res-save-btn" onclick="saveResult()">저장</button>
    </div>

    <!-- 인트로 -->
    <div class="res-intro">
      <div class="res-intro-kicker" id="res-kicker">B2B · Curated · 롯데백화점 동탄점</div>
      <p class="res-intro-desc" id="res-story">프리미엄 명절 선물 컬렉션 &amp; 이런 선물은 어떠신가요 큐레이션에서 엄선한 상품. 대량 할인 자동 적용.</p>
    </div>

    <!-- 3가지 패키지 카드 -->
    <div class="pkg-grid" id="pkg-grid">
      <!-- genResult()가 renderPkgCard()로 채움 -->
    </div>

    <!-- 큐레이터 코멘트 -->
    <div class="curator-comment">
      <div class="curator-comment-label">큐레이터 코멘트</div>
      <p class="curator-comment-text" id="curator-text">"PREMIUM 패키지는 수신자의 업무 환경과 생활 패턴을 분석하여, 받는 즉시 만족과 두고두고 사용하는 가치의 균형을 최우선으로 설계했습니다."</p>
      <div class="curator-name">&#8212; 롯데백화점 동탄점 선물 큐레이터 팀</div>
    </div>

    <!-- 하단 액션 -->
    <div class="res-bottom-actions">
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-d btn-s" onclick="addToCompare()">비교 목록에 추가하기</button>
        <button class="btn btn-o btn-s" onclick="wizRestart()">처음부터 다시하기</button>
        <button class="btn btn-o btn-s" onclick="toggleCompare()" id="btn-cmp">비교 보기 (0/3)</button>
      </div>
    </div>

  </div>
</section>

<section id="compare-section">
  <div style="max-width:1200px;margin:0 auto;padding:0 40px">
    <div style="margin-bottom:28px;padding-bottom:20px;border-bottom:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px">
      <div>
        <h3 style="font-size:20px;font-weight:700;letter-spacing:-0.02em">선물 컬렉션 비교</h3>
        <p style="font-size:12px;color:#888;margin-top:6px">저장된 컬렉션을 한눈에 비교하세요 (최대 3개)</p>
      </div>
      <button class="btn btn-o btn-s" onclick="wizRestart()">다른 조건으로 다시 설문하기</button>
    </div>
    <div class="cmp-grid" id="cmp-grid"></div>

    <!-- 비교 후 액션 -->
    <div id="cmp-actions" style="display:none;margin-top:40px;padding-top:32px;border-top:1px solid #e8e8e8;display:flex;justify-content:center;gap:12px;flex-wrap:wrap">
      <button class="btn btn-d" onclick="cmpQuickConsult()" style="padding:14px 32px;font-size:13px;letter-spacing:0.06em">컨시어지 상담 신청하기</button>
      <button class="btn btn-o" onclick="cmpQuickOrder()" style="padding:14px 32px;font-size:13px;letter-spacing:0.06em">온라인 주문하기</button>
    </div>
  </div>
</section>
