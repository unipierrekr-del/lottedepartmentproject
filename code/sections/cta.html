<section id="cta">

  <div class="cta-btns">
    <button class="btn btn-dark" onclick="scrollToWizard()">기업 선물 추천받기</button>
    <button class="btn btn-outline" onclick="showToast('컨시어지 상담이 예약되었습니다.')">컨시어지 상담 예약</button>
  </div>
