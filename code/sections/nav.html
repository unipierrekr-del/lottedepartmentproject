      <span class="pnav-overlay-brand">LOTTE DONGTAN · B2B</span>
      <button class="pnav-overlay-close" onclick="closeNavOverlay()">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M5 5l12 12M17 5L5 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      </button>
    </div>
    <nav class="pnav-overlay-links">
      <a href="#configurator" onclick="closeNavOverlay();setTimeout(()=>{var e=document.getElementById('configurator');if(e)e.scrollIntoView({behavior:'smooth'})},120)"><span class="pno-num">01</span><span class="pno-txt">나만의 선물 구성하기</span><span class="pno-arr">→</span></a>

      <button class="pno-ft-link" onclick="openAdmin();closeNavOverlay()">관리자</button>
    </div>
  </div>
</div>

<script>
function openNavOverlay(){var o=document.getElementById('pnav-overlay');if(o){o.classList.add('open');document.body.style.overflow='hidden';}}
function closeNavOverlay(){var o=document.getElementById('pnav-overlay');if(o){o.classList.remove('open');document.body.style.overflow='';}}
window.addEventListener('scroll',function(){
  var nav=document.getElementById('main-nav');
  if(nav){if(window.scrollY>60)nav.classList.add('scrolled');else nav.classList.remove('scrolled');}
},{passive:true});
</script>
