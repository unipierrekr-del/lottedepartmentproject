<!-- 전체화면 영상 + 오버레이 -->
<section id="hero-video" class="phero">
  <div class="phero-video">
    <iframe
      src="https://www.youtube.com/embed/IRvepLZnH-g?autoplay=1&mute=1&loop=1&playlist=IRvepLZnH-g&controls=0&rel=0&playsinline=1"
      title="Hero Background Video"
      allow="autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
  <div class="phero-overlay"></div>
  <div class="phero-content">
    <div class="phero-kicker">LOTTE DONGTAN · B2B GIFT CONCIERGE</div>
    <h1 class="phero-title">기업 선물의<br>새로운 기준</h1>
    <p class="phero-sub">백화점 전문 큐레이터가 설계하는 프리미엄 기프팅 솔루션</p>
    <div class="phero-actions">
      <button class="phero-btn-dark" onclick="scrollToConfigurator()">나만의 선물 구성하기</button>
      <button class="phero-btn-outline" onclick="scrollToWizard()">빠른 추천받기</button>
    </div>
  </div>
  <div class="phero-scroll-ind">
    <span class="phero-scroll-line"></span>
    <span class="phero-scroll-lbl">SCROLL</span>
  </div>
</section>

<script>
function scrollToConfigurator(){
  var el=document.getElementById('configurator');
  if(el)el.scrollIntoView({behavior:'smooth'});
  else scrollToWizard();
}
</script>
